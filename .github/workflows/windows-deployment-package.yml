name: Build Windows deployment package

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  package:
    name: Package for Windows x64
    runs-on: windows-2022
    timeout-minutes: 30

    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4
        with:
          version: 10.28.0

      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: pnpm

      - name: Install production build dependencies
        run: pnpm install --frozen-lockfile

      - name: Generate Prisma client and build
        run: |
          pnpm prisma:generate
          pnpm typecheck
          pnpm build

      - name: Create offline deployment archive
        shell: pwsh
        run: |
          $releaseRoot = Join-Path $env:GITHUB_WORKSPACE "release\\zhbi"
          $apiRoot = Join-Path $releaseRoot "apps\\api"
          $pnpmApiRoot = Join-Path $env:GITHUB_WORKSPACE "release\\api-pnpm-layout"
          $archivePath = Join-Path $env:GITHUB_WORKSPACE "release\\zhbi-windows-x64.zip"
          New-Item -ItemType Directory -Force -Path $apiRoot | Out-Null

          # Keep only the API runtime dependencies. Prisma stays in production
          # dependencies so migrations can run on the offline target server.
          pnpm --filter @drag-visual/api --prod deploy --legacy $pnpmApiRoot

          # pnpm uses Windows junctions in node_modules. Materialize the link
          # targets before creating the ZIP so Explorer can extract a complete
          # runtime without losing Prisma's nested dependencies.
          node .github/scripts/make-portable-api-runtime.mjs $pnpmApiRoot $apiRoot

          New-Item -ItemType Directory -Force -Path (Join-Path $releaseRoot "apps\\web") | Out-Null
          Copy-Item -Recurse -Force "apps\\web\\dist" (Join-Path $releaseRoot "apps\\web\\dist")
          Copy-Item -Recurse -Force "prisma" (Join-Path $releaseRoot "prisma")
          Copy-Item -Force "package.json", "pnpm-lock.yaml", "pnpm-workspace.yaml", "prisma.config.ts", ".env.example" -Destination $releaseRoot

          if (-not (Test-Path (Join-Path $apiRoot "dist\\main.js"))) { throw "API build output is missing." }
          if (-not (Test-Path (Join-Path $apiRoot "node_modules\\.bin\\prisma.cmd"))) { throw "Prisma CLI is missing from the runtime package." }
          if (-not (Test-Path (Join-Path $releaseRoot "apps\\web\\dist\\index.html"))) { throw "Web build output is missing." }
          $runtimeLink = Get-ChildItem -Force -Recurse (Join-Path $apiRoot "node_modules") | Where-Object { $_.Attributes -band [IO.FileAttributes]::ReparsePoint } | Select-Object -First 1
          if ($runtimeLink) { throw "Portable runtime still contains a link: $($runtimeLink.FullName)" }

          Push-Location $releaseRoot
          tar.exe -a -c -f $archivePath apps prisma package.json pnpm-lock.yaml pnpm-workspace.yaml prisma.config.ts .env.example
          Pop-Location

          $verificationRoot = Join-Path $env:GITHUB_WORKSPACE "release\\archive-verification"
          Expand-Archive -LiteralPath $archivePath -DestinationPath $verificationRoot -Force
          & (Join-Path $verificationRoot "apps\\api\\node_modules\\.bin\\prisma.cmd") version

          Get-FileHash -Algorithm SHA256 $archivePath | Format-List

      - uses: actions/upload-artifact@v4
        with:
          name: zhbi-windows-x64
          path: release/zhbi-windows-x64.zip
          if-no-files-found: error
          retention-days: 14
